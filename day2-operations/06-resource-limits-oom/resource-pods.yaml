# =============================================================================
# oom-pod.yaml: Pod designed to trigger Linux Kernel OOMKill (Exit Code 137)
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: memory-eater
    image: python:3.11-alpine
    command: ["python3", "-c"]
    args:
    - |
      import time
      print("Allocating 120MB in chunks against a 64Mi limit...")
      data = []
      for i in range(12):
          data.append(b"x" * 10 * 1024 * 1024)
          print(f"Allocated {(i+1)*10}MB")
          time.sleep(0.4)
      print("Done")
    resources:
      requests:
        memory: "32Mi"
      limits:
        memory: "64Mi"
---
# =============================================================================
# cpu-throttle-pod.yaml: Pod throttled by CFS Bandwidth Quotas
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: cpu-throttle-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: cpu-cruncher
    image: busybox:1.36.1
    command: ["sh", "-c", "while true; do :; done"]
    resources:
      requests:
        cpu: "50m"
      limits:
        cpu: "100m"
