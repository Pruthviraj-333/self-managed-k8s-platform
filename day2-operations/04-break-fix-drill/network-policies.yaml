# =============================================================================
# break-network.yaml: Faulty NetworkPolicy isolating productcatalogservice
# Causes frontend gRPC timeouts and HTTP 500 errors
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-catalog
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: productcatalogservice
  policyTypes:
  - Ingress
  # Empty ingress list acts as a Default Deny for incoming traffic
  ingress: []
---
# =============================================================================
# fix-network.yaml: Corrected NetworkPolicy allowing frontend gRPC ingress
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-catalog
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: productcatalogservice
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 3550
