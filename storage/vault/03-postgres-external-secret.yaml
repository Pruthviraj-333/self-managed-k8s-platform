# =============================================================================
# 03-postgres-external-secret.yaml
# ExternalSecret: ESO reads postgres credentials from Vault KV store and
# automatically creates (and keeps in sync) the K8s Secret.
#
# The PostgreSQL StatefulSet references 'postgres-credentials' by name —
# it doesn't need any changes. ESO just takes over *creating* that Secret.
#
# Apply: kubectl apply -f storage/vault/03-postgres-external-secret.yaml
# Verify: kubectl get secret postgres-credentials -o yaml
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: default
spec:
  # How often ESO re-syncs from Vault (keeps Secret updated if Vault changes)
  refreshInterval: "1h"

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  # The K8s Secret ESO will create / manage
  target:
    name: postgres-credentials     # Same name the StatefulSet already references
    creationPolicy: Owner          # ESO owns this Secret — deletes it if ExternalSecret is deleted
    template:
      type: Opaque

  # Mapping: pull specific keys from Vault KV → put into K8s Secret
  data:
  - secretKey: POSTGRES_DB          # Key name in the K8s Secret
    remoteRef:
      key: postgres/credentials     # Path in Vault (under 'secret/' prefix)
      property: POSTGRES_DB         # Field name stored in Vault

  - secretKey: POSTGRES_USER
    remoteRef:
      key: postgres/credentials
      property: POSTGRES_USER

  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: postgres/credentials
      property: POSTGRES_PASSWORD
