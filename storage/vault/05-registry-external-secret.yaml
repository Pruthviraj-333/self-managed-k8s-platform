# =============================================================================
# 05-registry-external-secret.yaml
# ExternalSecret: ESO reads the in-cluster container registry credentials
# from Vault and creates the 'registry-credentials' K8s Secret.
#
# This secret can be referenced as an imagePullSecret on pods that need
# to pull from the private registry at k8s-cp1:30500.
#
# Apply: kubectl apply -f storage/vault/05-registry-external-secret.yaml
# Verify: kubectl get secret registry-credentials -o yaml
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-credentials
  namespace: default
spec:
  refreshInterval: "1h"

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      # Template generates a proper docker config JSON for imagePullSecrets
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .REGISTRY_URL }}": {
                "username": "{{ .REGISTRY_USER }}",
                "password": "{{ .REGISTRY_PASSWORD }}",
                "auth": "{{ printf "%s:%s" .REGISTRY_USER .REGISTRY_PASSWORD | b64enc }}"
              }
            }
          }

  data:
  - secretKey: REGISTRY_URL
    remoteRef:
      key: registry/credentials
      property: REGISTRY_URL

  - secretKey: REGISTRY_USER
    remoteRef:
      key: registry/credentials
      property: REGISTRY_USER

  - secretKey: REGISTRY_PASSWORD
    remoteRef:
      key: registry/credentials
      property: REGISTRY_PASSWORD
