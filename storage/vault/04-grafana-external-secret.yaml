# =============================================================================
# 04-grafana-external-secret.yaml
# ExternalSecret: ESO reads Grafana admin credentials from Vault and
# creates the 'grafana-credentials' K8s Secret in the monitoring namespace.
#
# Apply: kubectl apply -f storage/vault/04-grafana-external-secret.yaml
# Verify: kubectl get secret grafana-credentials -n monitoring -o yaml
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: monitoring
spec:
  refreshInterval: "1h"

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: grafana-credentials
    creationPolicy: Owner
    template:
      type: Opaque

  data:
  - secretKey: GF_SECURITY_ADMIN_USER
    remoteRef:
      key: grafana/credentials
      property: GF_SECURITY_ADMIN_USER

  - secretKey: GF_SECURITY_ADMIN_PASSWORD
    remoteRef:
      key: grafana/credentials
      property: GF_SECURITY_ADMIN_PASSWORD
