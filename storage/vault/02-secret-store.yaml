# =============================================================================
# 02-secret-store.yaml
# VaultSecretStore: tells External Secrets Operator WHERE Vault is
# and HOW to authenticate (Kubernetes ServiceAccount token)
#
# Apply: kubectl apply -f storage/vault/02-secret-store.yaml
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  # ClusterSecretStore works across ALL namespaces
  # (vs SecretStore which is namespace-scoped)
spec:
  provider:
    vault:
      # Vault service endpoint inside the cluster
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"

      # Kubernetes Auth: ESO authenticates to Vault using its own
      # ServiceAccount token — no hardcoded Vault tokens needed
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
