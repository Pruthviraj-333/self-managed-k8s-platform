# =============================================================================
# DEMO / DEVELOPMENT ONLY — DO NOT USE IN PRODUCTION
# =============================================================================
# In this file the PostgreSQL password is stored in plaintext for demonstration
# purposes. This is INTENTIONAL for the local lab environment only.
#
# PRODUCTION EQUIVALENT (implemented in storage/vault/):
#   - The password is stored in HashiCorp Vault at: secret/postgres/credentials
#   - External Secrets Operator (ESO) reads from Vault and AUTO-CREATES this
#     K8s Secret — no plaintext credentials ever exist in any YAML file.
#   - See: storage/vault/03-postgres-external-secret.yaml
#   - See: docs/04-secrets-management.md for full architectural explanation
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: "ecommerce_db"
  POSTGRES_USER: "postgres_admin"
  POSTGRES_PASSWORD: "SelfManagedK8sPassword123!"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: default
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    name: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
