# =============================================================================
# postgres-secret-svc.yaml
# =============================================================================
#
# SECRET REMOVED — Managed by HashiCorp Vault + External Secrets Operator
# -------------------------------------------------------------------------
# The 'postgres-credentials' K8s Secret is NO LONGER defined here.
# It is automatically created and kept in sync by the External Secrets
# Operator which reads from HashiCorp Vault.
#
# Vault path:      secret/postgres/credentials
# ESO definition:  storage/vault/03-postgres-external-secret.yaml
# Documentation:   docs/04-secrets-management.md
#
# To manually rotate the password (no YAML edits needed):
#   vault kv put secret/postgres/credentials POSTGRES_PASSWORD="<new-password>"
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: default
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    name: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql

apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: default
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    name: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
